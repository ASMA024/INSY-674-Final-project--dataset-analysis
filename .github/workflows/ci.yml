name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint and format check
        run: |
          ruff format --check .
          ruff check .
      - name: Unit tests
        run: python -m pytest --cov=churn --cov-report=term-missing

  integration:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Build image
        run: docker build -t churn-api:${{ github.sha }} .
      - name: Start container
        run: |
          docker run -d -p 8000:8000 --name api churn-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
      - name: Integration tests (training -> registry, and live API in Docker)
        env:
          API_URL: http://localhost:8000
        run: python -m pytest -m integration -v
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=$(echo ghcr.io/${{ github.repository }}/churn-api | tr '[:upper:]' '[:lower:]')
          docker tag churn-api:${{ github.sha }} $IMAGE:latest
          docker tag churn-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
