name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest --cov=churn --cov-report=term-missing

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-api:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api churn-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d @tests/sample_request.json
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}/churn-api
          IMAGE=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker tag churn-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest
    permissions:
      contents: read
      packages: write
